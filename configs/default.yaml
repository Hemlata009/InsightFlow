# Layer 1: generic policies for ANY dataset (no domain-specific names here).
# Later layers (configs/domains/<domain>.yaml, configs/datasets/<id>.yaml) override these values.

policies:
  # Text that means "no value"
  null_markers: ["", "NA", "N/A", "n/a", "NULL", "null", "None", "-", "--", "?", "nan", "NaN"]
  strip_whitespace: true            # " north " -> "north"
  collapse_inner_spaces: true       # "Desk   Organizer" -> "Desk Organizer"
  categorical_case: match_known     # "NORTH" -> "North" when "North" is an allowed/known value
  ambiguous_dates: use_locale       # 01/02/2026: read with the locale's date order; never guess
  extra_date_formats:               # also accepted besides the locale format
    - "%Y-%m-%d"                    # ISO 2026-03-05
    - "%d-%b-%y"                    # 05-Mar-26
    - "%d-%b-%Y"                    # 05-Mar-2026
  excel_serial_dates: true          # 45746 -> 2025-03-30 (only if inside date_range); 45746.5 = with time
  two_digit_years: true             # 05/03/26 -> 2026 (00-68 -> 20xx, 69-99 -> 19xx); range check still applies
  unix_timestamps: true             # 1741132800 / ...000 (ms) / ...000000 (µs), UTC; only if inside date_range
  compact_dates: true               # 20250305; only if inside date_range
  dateparser_fallback: true         # other written dates ("5th March 2025", "5 मार्च 2025") via dateparser, strict
  timezone: null                    # business time zone; required to read times like "...+05:30" or "...Z"
  partial_dates:                    # "Mar 2025" (no day) / "05/03" (no year): completed rows are FLAGGED
    missing_day: first_of_month     # first_of_month | last_of_month | fixed_day | median_day | mean_day | mode_day
                                    # | previous_row | next_row (insert up/down) | plugin | quarantine
    missing_year: mode_year         # mode_year | previous_row | next_row | fixed_year | plugin | quarantine
    fixed_day: 1
    fixed_year: null
  percent_strings: true             # "10%" -> 0.10
  accounting_negatives: true        # "(1,000)" -> -1000
  magnitude_suffixes: true          # 15K, 2.5M, 1.2 L, 3 Cr (per locale)
  invalid_value_action: quarantine  # bad values are set aside with a reason, never deleted
  max_quarantine_share: 0.20        # above this share of rows -> status needs_review
  max_file_mb: 50                   # above this (or if it won't fit in free RAM) -> chunked mode
  large_files: auto                 # auto | always | never: read in pieces, dedupe on disk with DuckDB
  chunk_rows: 20000                 # rows per piece in chunked mode (tuned for this ~6 GB RAM PC)
  duckdb_memory_mb: 128             # DuckDB memory cap; it spills to disk beyond this
  max_chunked_file_mb: 5000         # even chunked mode refuses files larger than this

duplicates:
  exact: drop                       # identical rows (after normalization): keep the first, log the rest
  key: []                           # business key; set by the domain/dataset layer
  key_conflict: flag                # same key, different values -> flag for review

# Currency conversion (ECB reference rates, offline). Off by default: amounts stay in the dataset currency.
currency:
  foreign_amounts: refuse          # refuse | convert  ("US$100" in an INR dataset, at the row's date)
  reporting_currency: null         # e.g. USD -> adds Sales_USD, Profit_USD, Unit_Price_USD to the output
  rate_date_column: null           # e.g. Order_Date
  max_rate_age_days: 7             # weekends/holidays: use the last rate up to 7 days earlier

# Columns and rules are defined by the domain layer.
columns: {}
rules: {}

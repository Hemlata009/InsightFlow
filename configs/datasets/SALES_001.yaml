# Layer 3: SALES_001, real Superstore data (US).
dataset_id: SALES_001
domain: sales
locale: en_US
description: Tableau Sample - Superstore (US retail, 2014-2017)

date_range: {min: "2014-01-01", max: "2017-12-31"}

columns:
  Region:
    allowed_values: [Central, East, South, West]
  Category:
    allowed_values: [Furniture, Office Supplies, Technology]
  Segment:
    allowed_values: [Consumer, Corporate, Home Office]

business:
  returns_allowed: false            # Superstore has no returns: negative quantity = invalid

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightflow"
version = "0.1.0"
description = "Automated analytics and data-quality engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pandera>=0.20",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "psutil>=5.9", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
